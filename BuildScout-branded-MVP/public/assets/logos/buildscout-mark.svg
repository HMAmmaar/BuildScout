<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="100%" height="100%">
  
  
  <!-- Abstract B with Crosshair/Compass/Build path -->
  <g transform="translate(10, 10) scale(1.2)">
    <!-- Outer Crosshair Arc / Ring segment -->
    <path d="M 12 4 A 16 16 0 0 1 28 20 A 16 16 0 0 1 20 35" fill="none" stroke="#F2A81D" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <path d="M 4 20 A 16 16 0 0 1 20 4" fill="none" stroke="#F2A81D" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    
    <!-- Crosshair ticks -->
    <line x1="20" y1="0" x2="20" y2="5" stroke="#F2A81D" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="20" x2="5" y2="20" stroke="#F2A81D" stroke-width="2.5" stroke-linecap="round" />
    <line x1="35" y1="20" x2="40" y2="20" stroke="#F2A81D" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="35" x2="20" y2="40" stroke="#F2A81D" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Abstract Sharp 'B' / Scout Arrow / Route Path -->
    <path d="M 12 8 L 22 8 C 27 8 30 11 30 15 C 30 18 28 20 25 21 C 29 22 32 25 32 30 C 32 35 27 38 21 38 L 12 38 Z" fill="none" stroke="#F2A81D" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 12 8 L 12 38 L 22 23 L 30 15 Z" fill="#F2A81D" opacity="0.25" />
    <path d="M 12 21 L 25 21" stroke="#F2A81D" stroke-width="3" stroke-linecap="round" />
    
    <!-- Scout Pointer Arrow integrated into B loop -->
    <polygon points="20,23 28,20 23,28 22,23" fill="#F2A81D" />
  </g>

</svg>